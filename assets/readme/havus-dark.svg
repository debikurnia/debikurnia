<svg xmlns="http://www.w3.org/2000/svg" width="500" height="310" viewBox="0 0 500 310" role="img" aria-label="Havus, new open source macOS app under the MIT license: a lightweight Mac cleaner that minds its own business. It clears caches, logs and developer junk, uninstalls apps with their leftovers and finds large files you rarely open, and everything goes to the Trash first. In my test it is a 1.5 MB app that idles at about 34 MB of memory, with no network access at all."><title>Havus, new open source macOS app under the MIT license: a lightweight Mac cleaner that minds its own business. It clears caches, logs and developer junk, uninstalls apps with their leftovers and finds large files you rarely open, and everything goes to the Trash first. In my test it is a 1.5 MB app that idles at about 34 MB of memory, with no network access at all.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.grow{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes scan{0%{transform:scaleX(0);opacity:1}30%,90%{transform:scaleX(1);opacity:1}97%,100%{transform:scaleX(1);opacity:0}}.scan{transform-box:fill-box;transform-origin:left center;animation:scan 7s cubic-bezier(.32,.72,0,1) infinite}@keyframes ok{0%,30%{opacity:0;transform:scale(.4)}36%,90%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}</style><defs></defs><rect x="8" y="8" width="484" height="294" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1.25"/><rect x="36" y="30" width="428" height="96" rx="10" fill="#0d1117" stroke="#30363d"/><path d="M148 30H46a10 10 0 0 0-10 10V116a10 10 0 0 0 10 10H148Z" fill="#e6edf3" fill-opacity="0.04"/><path d="M148 30V126" stroke="#30363d"/><circle cx="50" cy="41" r="3.8" fill="#ff5f57"/><circle cx="63" cy="41" r="3.8" fill="#febc2e"/><circle cx="76" cy=