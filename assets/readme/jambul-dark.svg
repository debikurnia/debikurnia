<svg xmlns="http://www.w3.org/2000/svg" width="500" height="310" viewBox="0 0 500 310" role="img" aria-label="Jambul, open source macOS app under the MIT license: a Dynamic Island for the MacBook notch, with a timer whose dial shrinks like a kitchen timer&#x27;s, Keep Awake and its pair of eyes, battery peeks, your AI usage limits and which Claude Code sessions are working, waiting for you or done. It aims for about 0% CPU while idle and less than 30 MB of memory."><title>Jambul, open source macOS app under the MIT license: a Dynamic Island for the MacBook notch, with a timer whose dial shrinks like a kitchen timer&#x27;s, Keep Awake and its pair of eyes, battery peeks, your AI usage limits and which Claude Code sessions are working, waiting for you or done. It aims for about 0% CPU while idle and less than 30 MB of memory.</title><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}.grow{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}@keyframes blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}.eye{animation:blink 4.6s ease-in-out infinite}</style><defs><linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#221a4d"/><stop offset="1" stop-color="#0c1a33"/></linearGradient><clipPath id="screen"><rect x="36" y="30" width="428" height="96" rx="10"/></clipPath><radialGradient id="w1" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#a371f7" stop-opacity="0.35"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient><radialGradient id="w2" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#4493f8" stop-opacity="0.3"/><stop offset="1" stop-color="#4493f8" stop-opacity="0"/></radialGradient></defs><rect x="8" y="8" width="484" height="294" rx="20" fill="#161b22" stroke="#30363d" stroke-wi