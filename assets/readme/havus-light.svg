t-weight="600" text-anchor="end">640 MB</text><text x="36" y="158" font-size="12" fill="#6e40c9" class="mono" font-weight="600" letter-spacing="1.8">OPEN SOURCE · MACOS · MIT</text><path d="M452 159L464 147M455.5 147H464V155.5" fill="none" stroke="#6e7781" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="35" y="193" font-size="28" fill="#1f2328" font-weight="700" letter-spacing="-0.4">Havus</text><text x="36" y="221" font-size="15.5" fill="#1f2328">A Mac cleaner that minds its own business.</text><text x="36" y="244" font-size="14" fill="#59636e">In my test: 1.5 MB app, about 34 MB idle.</text><rect x="36.0" y="258" width="105.6" height="24" rx="12" fill="#6e40c9" fill-opacity="0.08" stroke="#6e40c9" stroke-opacity="0.3"/><text x="88.815" y="274.2" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">Developer junk</text><rect x="149.6" y="258" width="80.6" height="24" rx="12" fill="#6e40c9" fill-opacity="0.08" stroke="#6e40c9" stroke-opacity="0.3"/><text x="189.952" y="274.2" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">Uninstaller</text><rect x="238.3" y="258" width="73.5" height="24" rx="12" fill="#6e40c9" fill-opacity="0.08" stroke="#6e40c9" stroke-opacity="0.3"/><text x="275.025" y="274.2" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">Disk map</text><rect x="319.8" y="258" width="77.1" height="24" rx="12" fill="#6e40c9" fill-opacity="0.08" stroke="#6e40c9" stroke-opacity="0.3"/><text x="358.314" y="274.2" font-size="12" fill="#1f2328" font-weight="600" text-anchor="middle">Trash first</text></svg>
